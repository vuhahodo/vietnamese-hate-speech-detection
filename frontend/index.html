<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vietnamese Hate Speech Detector</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --border:         rgba(11,11,11,0.10);
    --good:           #0ca30c;
    --warning:        #fab219;
    --critical:       #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --border:         rgba(255,255,255,0.10);
      --good:           #0ca30c;
      --warning:        #fab219;
      --critical:       #d03b3b;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 1.35rem; margin-bottom: 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  textarea {
    width: 100%;
    min-height: 100px;
    resize: vertical;
    font-family: inherit;
    font-size: 1rem;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
  }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  button {
    background: var(--text-primary);
    color: var(--surface-1);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .backend-tag { font-size: 0.8rem; color: var(--text-muted); }

  .result { margin-top: 24px; display: none; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  .badge .dot { width: 10px; height: 10px; border-radius: 50%; }
  .badge.clean     { color: var(--good); }
  .badge.offensive { color: var(--warning); }
  .badge.hate      { color: var(--critical); }
  .badge.clean .dot     { background: var(--good); }
  .badge.offensive .dot { background: var(--warning); }
  .badge.hate .dot      { background: var(--critical); }

  .bars { margin-top: 20px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { width: 90px; font-size: 0.85rem; color: var(--text-secondary); flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--page); border-radius: 4px; height: 16px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
  .bar-fill.clean     { background: var(--good); }
  .bar-fill.offensive { background: var(--warning); }
  .bar-fill.hate      { background: var(--critical); }
  .bar-value { width: 48px; text-align: right; font-size: 0.85rem; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

  .error { color: var(--critical); margin-top: 16px; font-size: 0.9rem; }
  .hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 16px; }
</style>
</head>
<body>
  <div class="viz-root wrap">
    <h1>Vietnamese Hate Speech Detector</h1>
    <p class="subtitle">PhoBERT fine-tuned on ViHSD — classifies a comment as CLEAN / OFFENSIVE / HATE.</p>

    <div class="card">
      <textarea id="text" placeholder="Nhập bình luận tiếng Việt để kiểm tra..."></textarea>
      <div class="row">
        <span class="backend-tag" id="backend-tag"></span>
        <button id="submit">Phân loại</button>
      </div>
    </div>

    <div class="result" id="result">
      <div id="badge" class="badge"></div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="error" id="error"></div>
    <p class="hint">Demo model — nhãn CLEAN không đồng nghĩa với "an toàn tuyệt đối"; xem xác suất từng lớp để đánh giá độ chắc chắn.</p>
  </div>

<script>
const API_BASE = window.API_BASE || 'http://127.0.0.1:8123';
const LABELS = [
  { key: 'CLEAN', cls: 'clean', icon: '✓', name: 'CLEAN' },
  { key: 'OFFENSIVE', cls: 'offensive', icon: '!', name: 'OFFENSIVE' },
  { key: 'HATE', cls: 'hate', icon: '⛔', name: 'HATE' },
];

const btn = document.getElementById('submit');
const textEl = document.getElementById('text');
const resultEl = document.getElementById('result');
const badgeEl = document.getElementById('badge');
const barsEl = document.getElementById('bars');
const errorEl = document.getElementById('error');
const backendTag = document.getElementById('backend-tag');

fetch(`${API_BASE}/health`).then(r => r.json()).then(d => {
  backendTag.textContent = `model: ${d.backend}`;
}).catch(() => { backendTag.textContent = 'API không kết nối được'; });

btn.addEventListener('click', async () => {
  const text = textEl.value.trim();
  if (!text) return;
  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Đang phân tích...';
  try {
    const res = await fetch(`${API_BASE}/predict`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error(`API lỗi (${res.status})`);
    const data = await res.json();
    render(data);
  } catch (e) {
    errorEl.textContent = e.message;
    resultEl.style.display = 'none';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Phân loại';
  }
});

function render(data) {
  const info = LABELS.find(l => l.key === data.label);
  badgeEl.className = `badge ${info.cls}`;
  badgeEl.innerHTML = `<span class="dot"></span> ${info.name} <span style="color:var(--text-muted); font-weight:400;">(${(data.confidence*100).toFixed(1)}%)</span>`;

  barsEl.innerHTML = '';
  for (const l of LABELS) {
    const p = data.probabilities[l.key] ?? 0;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-label">${l.name}</div>
      <div class="bar-track"><div class="bar-fill ${l.cls}" style="width:${(p*100).toFixed(1)}%"></div></div>
      <div class="bar-value">${(p*100).toFixed(1)}%</div>
    `;
    barsEl.appendChild(row);
  }
  resultEl.style.display = 'block';
}
</script>
</body>
</html>
